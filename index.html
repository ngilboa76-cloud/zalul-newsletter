<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>מחולל ניוזלטר – צלול</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--blue:#0871B9;--deep:#065A94;--tint:#C1DCEE;--mid:#4695CB;--ink:#2C3E50;--muted:#5E6E78;--bg:#F2F8FA;--line:#DCE8EF;--ok:#1E7B4A;--warn:#B25E00;--err:#B3261E;}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Heebo',Arial,sans-serif;color:var(--ink);background:var(--bg);}
  header{background:var(--blue);color:#fff;padding:18px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{margin:0;font-size:22px;font-weight:900}
  header p{margin:0;color:#E6F0F8;font-size:14px}
  .layout{display:grid;grid-template-columns:minmax(380px,520px) 1fr;gap:24px;padding:24px;align-items:start}
  @media (max-width:980px){.layout{grid-template-columns:1fr}}
  form{display:flex;flex-direction:column;gap:16px}
  fieldset{border:1px solid var(--line);background:#fff;border-radius:10px;padding:16px 18px 18px;margin:0}
  legend{font-weight:800;font-size:16px;padding:0 6px;color:var(--deep)}
  label{display:block;font-weight:700;font-size:14px;margin:12px 0 4px}
  label:first-of-type{margin-top:4px}
  .hint{font-weight:400;color:var(--muted);font-size:12.5px}
  input,textarea{width:100%;font:inherit;font-size:15px;padding:9px 11px;border:1px solid #C9D9E3;border-radius:7px;background:#fff;color:var(--ink)}
  input:focus,textarea:focus{outline:2px solid var(--mid);border-color:var(--mid)}
  input[dir=ltr]{text-align:left}
  textarea{min-height:92px;resize:vertical;line-height:1.55}
  .count{font-size:12px;color:var(--muted);text-align:left;margin-top:3px}
  .count.over{color:var(--err);font-weight:700}
  .item{border:1px dashed #C9D9E3;border-radius:9px;padding:12px 14px;margin-top:14px;background:#FBFDFE}
  .item h3{margin:0 0 4px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
  button{font:inherit;font-weight:700;border-radius:7px;border:0;cursor:pointer;padding:10px 16px;font-size:15px}
  .primary{background:var(--blue);color:#fff}
  .primary:hover{background:var(--deep)}
  .ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
  .link{background:none;color:var(--err);padding:2px 4px;font-size:13px}
  details summary{cursor:pointer;font-weight:800;color:var(--deep)}
  .side{position:sticky;top:16px;display:flex;flex-direction:column;gap:14px}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .bar .sp{flex:1}
  .seg button{background:#fff;color:var(--muted);border:1px solid #C9D9E3;padding:7px 12px;font-size:13px}
  .seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .seg button:first-child{border-radius:0 7px 7px 0}.seg button:last-child{border-radius:7px 0 0 7px}
  .frame{background:#E3EDF2;border-radius:10px;padding:14px;display:flex;justify-content:center;min-height:400px}
  iframe{border:0;background:#fff;width:700px;max-width:100%;height:1400px;border-radius:6px;transition:width .2s}
  iframe.mobile{width:390px}
  .side{max-height:none}
  .checks{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-size:14px}
  .checks h2{font-size:15px;margin:0 0 6px}
  .checks ul{margin:0;padding:0 18px 0 0}
  .checks li{margin:3px 0}
  .ok{color:var(--ok)}.warn{color:var(--warn)}.err{color:var(--err)}
  .up{display:flex;gap:12px;align-items:center;border:1.5px dashed #C9D9E3;border-radius:8px;padding:10px;background:#fff}
  .up.drag{border-color:var(--blue);background:#EAF3FA}
  .up .thumb{width:96px;height:54px;object-fit:cover;border-radius:5px;background:var(--bg);display:none}
  .up .thumb.on{display:block}
  .up-body{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
  .up-btn{padding:7px 14px;font-size:14px}
  .up-msg.err{color:var(--err)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>מחולל ניוזלטר צלול</h1>
  <p>ממלאים תוכן, בודקים בתצוגה המקדימה, מעתיקים את הקוד ומדביקים ב-ActiveTrail.</p>
</header>

<div class="layout">
<form id="f" autocomplete="off" onsubmit="return false">

  <fieldset>
    <legend>פרטי שליחה</legend>
    <label for="subject">שורת נושא <span class="hint">– עד 50 תווים. מוזנת ב-ActiveTrail, לא בקוד</span></label>
    <input id="subject" data-max="50">
    <div class="count" data-for="subject"></div>
    <label for="preheader">טקסט מקדים <span class="hint">– עד 90 תווים, משלים את שורת הנושא</span></label>
    <input id="preheader" data-max="90">
    <div class="count" data-for="preheader"></div>
    <label for="issue">חודש ושנה</label>
    <input id="issue" placeholder="דצמבר 2026">
  </fieldset>

  <fieldset>
    <legend>כותרת הגיליון</legend>
    <label for="h1a">שורה 1 <span class="hint">– עד 18 תווים</span></label>
    <input id="h1a" data-max="18">
    <div class="count" data-for="h1a"></div>
    <label for="h1b">שורה 2 <span class="hint">– עד 18 תווים, אפשר להשאיר ריק</span></label>
    <input id="h1b" data-max="18">
    <div class="count" data-for="h1b"></div>
    <label for="sub">משפט משנה <span class="hint">– עד 100 תווים</span></label>
    <input id="sub" data-max="100">
    <div class="count" data-for="sub"></div>
  </fieldset>

  <fieldset>
    <legend>פתיח</legend>
    <label for="greet">שורת פנייה</label>
    <input id="greet" value="שלום,">
    <label for="opening">טקסט הפתיח <span class="hint">– 3–4 שורות. שורה ריקה = פסקה חדשה</span></label>
    <textarea id="opening"></textarea>
    <label for="signName">שם החותם/ת</label>
    <input id="signName">
    <label for="signRole">תפקיד <span class="hint">– יופיע כ"[תפקיד], צלול"</span></label>
    <input id="signRole">
  </fieldset>

  <fieldset>
    <legend>אייטמים</legend>
    <div class="hint">האייטם הראשון הוא המוביל ומקבל כפתור. אפשר להוסיף עד 3 אייטמים נוספים.</div>
    <div id="items"></div>
    <div style="margin-top:12px"><button type="button" class="ghost" id="addItem">+ הוספת אייטם</button></div>
  </fieldset>

  <fieldset>
    <details id="fixedBox">
      <summary>פרטים קבועים (ממלאים פעם אחת, נשמרים בדפדפן)</summary>
      <label for="logo">קישור ללוגו <span class="hint">– מומלץ מספריית התמונות של ActiveTrail</span></label>
      <input id="logo" dir="ltr" value="https://zalul.org.il/wp-content/uploads/2022/02/ZALUL-LOGO-WIDE-BLUE-TRANSPARENT.png">
      <label for="unsub">קישור או תג הסרה של ActiveTrail</label>
      <input id="unsub" dir="ltr">
      <label for="webview">קישור או תג "צפייה בדפדפן" <span class="hint">– אם ריק, השורה לא תופיע</span></label>
      <input id="webview" dir="ltr">
      <label for="address">כתובת העמותה</label>
      <input id="address">
      <label for="donate">קישור לתרומה</label>
      <input id="donate" dir="ltr" value="https://zalul.org.il/donations/">
      <label for="volunteer">קישור להתנדבות</label>
      <input id="volunteer" dir="ltr" value="https://zalul.org.il/sea-defenders/join-zalul-voluntaries/">
    </details>
  </fieldset>

  <div><button type="button" class="link" id="reset">ניקוי תוכן הגיליון</button></div>
</form>

<div class="side">
  <div class="bar">
    <button type="button" class="primary" id="copy">העתקת קוד HTML</button>
    <button type="button" class="ghost" id="download">הורדת קובץ</button>
    <span class="sp"></span>
    <span class="seg"><button type="button" class="on" data-w="desktop">מחשב</button><button type="button" data-w="mobile">נייד</button></span>
  </div>
  <div class="checks" id="checks"></div>
  <div class="frame"><iframe id="pv" title="תצוגה מקדימה"></iframe></div>
</div>
</div>

<div class="toast" id="toast"></div>

<template id="itemTpl">
  <div class="item">
    <h3><span class="ttl"></span><button type="button" class="link rm">הסרה</button></h3>
    <label>תגית נושא <span class="hint">– לדוגמה: הים התיכון, נחלים, מפרץ אילת</span></label>
    <input data-k="tag">
    <label>כותרת</label>
    <input data-k="title">
    <label>תקציר <span class="hint">– 2–3 שורות</span></label>
    <textarea data-k="text" style="min-height:70px"></textarea>
    <label>קישור</label>
    <input data-k="url" dir="ltr" placeholder="https://">
    <label>תמונה <span class="hint">– אופציונלי</span></label>
    <div class="up">
      <img class="thumb" alt="">
      <div class="up-body">
        <button type="button" class="ghost up-btn">העלאת תמונה</button>
        <span class="up-msg hint">או גוררים תמונה לכאן</span>
        <input type="file" accept="image/*" class="up-file" hidden>
      </div>
    </div>
    <input data-k="img" dir="ltr" placeholder="או הדבקת קישור לתמונה https://" style="margin-top:8px">
    <label>תיאור התמונה <span class="hint">– לנגישות ולמי שהתמונות חסומות אצלו</span></label>
    <input data-k="alt">
    <label class="cta-l">טקסט הכפתור</label>
    <input data-k="cta">
  </div>
</template>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var FIELDS = ['subject','preheader','issue','h1a','h1b','sub','greet','opening','signName','signRole'];
  var FIXED = ['logo','unsub','webview','address','donate','volunteer'];
  var KEY_DRAFT = 'zalul-nl-draft-v1', KEY_FIXED = 'zalul-nl-fixed-v1';
  var MAX_ITEMS = 4;
  /* Cloudinary – unsigned upload. ממלאים פעם אחת. */
  var CLOUDINARY = { cloudName: 'xdadpf7e', uploadPreset: 'zalul_newsletter' };
  var IMG_WIDTH = 1040, IMG_QUALITY = 0.82;

  function store(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  function load(k){ try{ var s = localStorage.getItem(k); return s ? JSON.parse(s) : null; }catch(e){ return null; } }

  function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  // href values may be ActiveTrail tags; escape only quotes and angle brackets
  function attr(s){ return String(s == null ? '' : s).trim().replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function paras(s){
    return String(s || '').trim().split(/\n\s*\n/).map(function(p){ return esc(p.trim()).replace(/\n/g,'<br>'); })
      .filter(Boolean).join('<br><br>');
  }

  /* ---------- items UI ---------- */
  var itemsBox = $('items');
  function addItem(data){
    if (itemsBox.children.length >= MAX_ITEMS) return;
    var node = $('itemTpl').content.firstElementChild.cloneNode(true);
    data = data || {};
    node.querySelectorAll('[data-k]').forEach(function(el){ el.value = data[el.dataset.k] || ''; });
    node.querySelector('.rm').addEventListener('click', function(){ node.remove(); relabel(); update(); });
    wireUpload(node);
    itemsBox.appendChild(node); relabel();
  }

  /* ---------- image upload ---------- */
  function resize(file){
    return new Promise(function(res, rej){
      var url = URL.createObjectURL(file), im = new Image();
      im.onload = function(){
        var w = Math.min(IMG_WIDTH, im.naturalWidth), h = Math.round(im.naturalHeight * w / im.naturalWidth);
        var c = document.createElement('canvas'); c.width = w; c.height = h;
        var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(im, 0, 0, w, h);
        URL.revokeObjectURL(url);
        c.toBlob(function(b){ b ? res(b) : rej(new Error('resize')); }, 'image/jpeg', IMG_QUALITY);
      };
      im.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('read')); };
      im.src = url;
    });
  }
  function upload(blob){
    var fd = new FormData();
    fd.append('file', blob, 'newsletter.jpg');
    fd.append('upload_preset', CLOUDINARY.uploadPreset);
    return fetch('https://api.cloudinary.com/v1_1/' + encodeURIComponent(CLOUDINARY.cloudName) + '/image/upload', { method:'POST', body:fd })
      .then(function(r){ return r.json().then(function(j){ if (!r.ok || !j.secure_url) throw new Error((j.error && j.error.message) || 'upload'); return j.secure_url; }); });
  }
  function wireUpload(node){
    var box = node.querySelector('.up'), btn = node.querySelector('.up-btn'), file = node.querySelector('.up-file'),
        msg = node.querySelector('.up-msg'), thumb = node.querySelector('.thumb'), field = node.querySelector('[data-k="img"]');
    function say(t, bad){ msg.textContent = t; msg.classList.toggle('err', !!bad); }
    function showThumb(){ var v = field.value.trim(); thumb.classList.toggle('on', /^https?:\/\//.test(v)); if (/^https?:\/\//.test(v)) thumb.src = v; }
    field.addEventListener('input', showThumb); showThumb();
    function handle(f){
      if (!f) return;
      if (!/^image\//.test(f.type)) { say('הקובץ אינו תמונה', true); return; }
      if (!CLOUDINARY.cloudName || !CLOUDINARY.uploadPreset) { say('העלאה עוד לא חוברה – אפשר להדביק קישור', true); return; }
      btn.disabled = true; say('מקטין ומעלה…');
      resize(f).then(upload).then(function(u){
        field.value = u; showThumb(); say('התמונה הועלתה');
        var alt = node.querySelector('[data-k="alt"]'); if (!alt.value.trim()) alt.focus();
        update();
      }).catch(function(){ say('ההעלאה נכשלה – נסו שוב או הדביקו קישור', true); })
        .then(function(){ btn.disabled = false; file.value = ''; });
    }
    btn.addEventListener('click', function(){ file.click(); });
    file.addEventListener('change', function(){ handle(file.files[0]); });
    ['dragenter','dragover'].forEach(function(t){ box.addEventListener(t, function(e){ e.preventDefault(); box.classList.add('drag'); }); });
    ['dragleave','drop'].forEach(function(t){ box.addEventListener(t, function(e){ e.preventDefault(); box.classList.remove('drag'); }); });
    box.addEventListener('drop', function(e){ handle(e.dataTransfer.files[0]); });
  }
  function relabel(){
    Array.prototype.forEach.call(itemsBox.children, function(n, i){
      n.querySelector('.ttl').textContent = i === 0 ? 'אייטם מוביל' : 'אייטם ' + (i + 1);
      n.querySelector('.cta-l').innerHTML = i === 0 ? 'טקסט הכפתור <span class="hint">– לדוגמה: לקריאת הכתבה</span>' : 'טקסט הקישור <span class="hint">– לדוגמה: להמשך קריאה, לחתימה על העצומה</span>';
      n.querySelector('.rm').style.visibility = i === 0 ? 'hidden' : 'visible';
    });
    $('addItem').disabled = itemsBox.children.length >= MAX_ITEMS;
  }
  function readItems(){
    return Array.prototype.map.call(itemsBox.children, function(n){
      var o = {}; n.querySelectorAll('[data-k]').forEach(function(el){ o[el.dataset.k] = el.value; }); return o;
    });
  }
  function itemFilled(it){ return ['tag','title','text','url','img'].some(function(k){ return (it[k] || '').trim(); }); }

  /* ---------- email builder ---------- */
  var FF = "font-family:'Heebo',Arial,Helvetica,sans-serif;";
  var RULE = '<tr><td height="1" style="height:1px;background:#DCE8EF;font-size:0;line-height:0;">&nbsp;</td></tr>';

  function img(it, h){
    if (!(it.img || '').trim()) return '';
    var tag = '<img class="img-full" src="' + attr(it.img) + '" width="520" alt="' + esc(it.alt || it.title || '') + '" style="width:520px;height:auto;max-width:100%;display:block;border-radius:6px;background:#C1DCEE;">';
    if ((it.url || '').trim()) tag = '<a href="' + attr(it.url) + '" target="_blank">' + tag + '</a>';
    return '<tr><td style="padding:' + h + ';">' + tag + '</td></tr>';
  }
  function btn(href, label, bg, fg, size, pad, h, w){
    return '<tr><td class="btn" align="right">' +
      '<!--[if mso]><v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" href="' + attr(href) + '" style="height:' + h + 'px;v-text-anchor:middle;width:' + w + 'px;" arcsize="12%" stroke="f" fillcolor="' + bg + '"><w:anchorlock/><center style="color:' + fg + ';font-family:Arial,sans-serif;font-size:' + size + 'px;font-weight:bold;">' + esc(label) + '</center></v:roundrect><![endif]-->' +
      '<!--[if !mso]><!--><a href="' + attr(href) + '" target="_blank" class="ff" style="display:inline-block;background:' + bg + ';color:' + fg + ';' + FF + 'font-size:' + size + 'px;line-height:' + (size + 4) + 'px;font-weight:800;text-decoration:none;padding:' + pad + ';border-radius:6px;mso-hide:all;">' + esc(label) + ' &larr;</a><!--<![endif]-->' +
      '</td></tr>';
  }
  function itemBlock(it, i, isLast){
    var featured = i === 0;
    var rows = '';
    if (!featured) rows += RULE;
    rows += img(it, featured ? '0 0 20px' : '30px 0 18px');
    if (!featured && !(it.img || '').trim()) rows += '<tr><td style="height:28px;font-size:0;line-height:0;">&nbsp;</td></tr>';
    if ((it.tag || '').trim()) rows += '<tr><td class="ff" style="' + FF + 'font-size:13px;line-height:18px;font-weight:800;color:#0871B9;text-align:right;padding-bottom:8px;">' + esc(it.tag) + '</td></tr>';
    if ((it.title || '').trim()) rows += '<tr><td class="h2 ff" style="' + FF + 'font-size:' + (featured ? 26 : 22) + 'px;line-height:' + (featured ? 33 : 29) + 'px;font-weight:800;color:#2C3E50;text-align:right;padding-bottom:' + (featured ? 10 : 8) + 'px;">' + esc(it.title) + '</td></tr>';
    if ((it.text || '').trim()) rows += '<tr><td class="ff" style="' + FF + 'font-size:17px;line-height:28px;color:#2C3E50;text-align:right;padding-bottom:' + (featured ? 22 : 12) + 'px;">' + paras(it.text) + '</td></tr>';
    var label = (it.cta || '').trim() || (featured ? 'לקריאת הכתבה' : 'להמשך קריאה');
    if ((it.url || '').trim()) {
      rows += featured
        ? btn(it.url, label, '#0871B9', '#FFFFFF', 16, '14px 30px', 48, 220)
        : '<tr><td class="ff" style="' + FF + 'font-size:16px;line-height:24px;font-weight:700;text-align:right;"><a href="' + attr(it.url) + '" target="_blank" style="color:#0871B9;text-decoration:none;border-bottom:2px solid #C1DCEE;">' + esc(label) + ' &larr;</a></td></tr>';
    }
    var pad = featured ? '36px 40px ' + (isLast ? '44px' : '8px') : '36px 40px ' + (isLast ? '44px' : '0');
    return '<tr><td class="px" style="padding:' + pad + ';"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" dir="rtl">' + rows + '</table></td></tr>';
  }

  function build(d){
    var items = d.items.filter(function(it, i){ return i === 0 || itemFilled(it); });
    var headline = esc(d.h1a.trim()) + (d.h1b.trim() ? '<br>' + esc(d.h1b.trim()) : '');
    var out = [];
    out.push('<!DOCTYPE html>\n<html lang="he" dir="rtl" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<meta http-equiv="X-UA-Compatible" content="IE=edge">\n<meta name="x-apple-disable-message-reformatting">\n<meta name="color-scheme" content="light">\n<meta name="supported-color-schemes" content="light">\n<title>' + esc(d.subject || 'ניוזלטר צלול') + '</title>\n<!--[if mso]><noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript><style>body,table,td,a,p{font-family:Arial,sans-serif !important;}</style><![endif]-->\n<!--[if !mso]><!--><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800;900&display=swap" rel="stylesheet"><!--<![endif]-->\n<style>\nbody{margin:0;padding:0;width:100% !important;background:#F2F8FA;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;}\ntable{border-collapse:collapse;mso-table-lspace:0;mso-table-rspace:0;}\nimg{border:0;outline:none;text-decoration:none;-ms-interpolation-mode:bicubic;display:block;}\na{color:#0871B9;}\n@media only screen and (max-width:620px){.wrap{width:100% !important;}.px{padding-left:22px !important;padding-right:22px !important;}.h1{font-size:34px !important;line-height:40px !important;}.h2{font-size:22px !important;line-height:29px !important;}.img-full{width:100% !important;height:auto !important;}.btn a{display:block !important;}}\n</style>\n</head>\n<body style="margin:0;padding:0;background:#F2F8FA;">');
    if (d.preheader.trim()) out.push('<div style="display:none;max-height:0;overflow:hidden;mso-hide:all;font-size:1px;line-height:1px;color:#F2F8FA;">' + esc(d.preheader.trim()) + '&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;</div>');
    out.push('<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F2F8FA;" dir="rtl"><tr><td align="center" style="padding:20px 10px 32px;">');
    out.push('<!--[if mso]><table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" align="center"><tr><td><![endif]-->');
    out.push('<table role="presentation" class="wrap" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:600px;background:#FFFFFF;" dir="rtl">');
    if (d.webview.trim()) out.push('<tr><td class="px ff" style="padding:12px 40px;background:#F2F8FA;' + FF + 'font-size:12px;line-height:18px;color:#5E6E78;text-align:center;">לא מוצג כראוי? <a href="' + attr(d.webview) + '" style="color:#0871B9;text-decoration:underline;">לצפייה בדפדפן</a></td></tr>');
    out.push('<tr><td class="px" align="right" style="padding:28px 40px 22px;background:#FFFFFF;"><a href="https://zalul.org.il/" target="_blank"><img src="' + attr(d.logo) + '" width="170" alt="צלול – להגנת הים, האדם והסביבה" style="width:170px;height:auto;display:block;font-family:Arial,sans-serif;font-size:22px;font-weight:bold;color:#0871B9;"></a></td></tr>');
    // hero
    var hero = '<tr><td class="ff" style="' + FF + 'font-size:13px;line-height:18px;font-weight:700;color:#C1DCEE;text-align:right;padding-bottom:14px;">ניוזלטר צלול' + (d.issue.trim() ? ' &nbsp;|&nbsp; ' + esc(d.issue.trim()) : '') + '</td></tr>' +
      '<tr><td class="h1 ff" style="' + FF + 'font-size:44px;line-height:50px;font-weight:900;color:#FFFFFF;text-align:right;">' + headline + '</td></tr>' +
      '<tr><td style="padding:20px 0 ' + (d.sub.trim() ? '18px' : '0') + ';"><table role="presentation" cellpadding="0" cellspacing="0" border="0" align="right" dir="rtl">' +
        '<tr><td width="64" height="4" style="width:64px;height:4px;background:#FFFFFF;font-size:0;line-height:0;">&nbsp;</td></tr><tr><td height="4" style="height:4px;font-size:0;line-height:0;">&nbsp;</td></tr>' +
        '<tr><td width="40" height="4" style="width:40px;height:4px;background:#C1DCEE;font-size:0;line-height:0;">&nbsp;</td></tr><tr><td height="4" style="height:4px;font-size:0;line-height:0;">&nbsp;</td></tr>' +
        '<tr><td width="18" height="4" style="width:18px;height:4px;background:#4695CB;font-size:0;line-height:0;">&nbsp;</td></tr></table></td></tr>' +
      (d.sub.trim() ? '<tr><td class="ff" style="' + FF + 'font-size:18px;line-height:28px;color:#E6F0F8;text-align:right;">' + esc(d.sub.trim()) + '</td></tr>' : '');
    out.push('<tr><td class="px" style="padding:40px 40px 38px;background:#0871B9;" bgcolor="#0871B9"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" dir="rtl">' + hero + '</table></td></tr>');
    // opening
    var op = '';
    if (d.greet.trim()) op += '<tr><td class="ff" style="' + FF + 'font-size:20px;line-height:28px;font-weight:800;color:#2C3E50;text-align:right;padding-bottom:12px;">' + esc(d.greet.trim()) + '</td></tr>';
    if (d.opening.trim()) op += '<tr><td class="ff" style="' + FF + 'font-size:17px;line-height:28px;color:#2C3E50;text-align:right;">' + paras(d.opening) + '</td></tr>';
    if (d.signName.trim()) op += '<tr><td style="padding-top:22px;"><table role="presentation" cellpadding="0" cellspacing="0" border="0" align="right" dir="rtl"><tr><td width="4" style="width:4px;background:#0871B9;font-size:0;line-height:0;">&nbsp;</td><td class="ff" style="padding-right:12px;' + FF + 'font-size:15px;line-height:21px;color:#2C3E50;text-align:right;"><strong style="font-weight:800;">' + esc(d.signName.trim()) + '</strong><br><span style="color:#5E6E78;">' + (d.signRole.trim() ? esc(d.signRole.trim()) + ', ' : '') + 'צלול</span></td></tr></table></td></tr>';
    if (op) {
      out.push('<tr><td class="px" style="padding:40px 40px 34px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" dir="rtl">' + op + '</table></td></tr>');
      out.push('<tr><td class="px" style="padding:0 40px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">' + RULE + '</table></td></tr>');
    }
    items.forEach(function(it, i){ out.push(itemBlock(it, i, i === items.length - 1)); });
    // fixed support closing
    out.push('<tr><td class="px" style="padding:44px 40px 42px;background:#065A94;" bgcolor="#065A94"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" dir="rtl">' +
      '<tr><td class="ff" style="' + FF + 'font-size:13px;line-height:18px;font-weight:700;color:#C1DCEE;text-align:right;padding-bottom:10px;">כל זה קורה בזכותכם</td></tr>' +
      '<tr><td class="h2 ff" style="' + FF + 'font-size:30px;line-height:37px;font-weight:900;color:#FFFFFF;text-align:right;padding-bottom:14px;">תרמו, ובזכותכם יהיה פה צלול יותר</td></tr>' +
      '<tr><td class="ff" style="' + FF + 'font-size:17px;line-height:28px;color:#E6F0F8;text-align:right;padding-bottom:26px;">התרומה שלכם מאפשרת לנו להמשיך לעבוד מול הממשלה והרשויות, בבתי המשפט ובשטח, למען הים, החופים והנחלים שלנו.</td></tr>' +
      btn(d.donate, 'תרמו עכשיו', '#FFFFFF', '#065A94', 18, '15px 40px', 52, 200) +
      (d.volunteer.trim() ? '<tr><td class="ff" style="' + FF + 'font-size:15px;line-height:22px;color:#E6F0F8;text-align:right;padding-top:22px;">מעדיפים לתת מזמנכם? <a href="' + attr(d.volunteer) + '" target="_blank" style="color:#FFFFFF;font-weight:700;text-decoration:underline;">הצטרפו למתנדבי צלול</a></td></tr>' : '') +
      '</table></td></tr>');
    // footer
    var dot = '<span style="color:#C1DCEE;">&nbsp;&nbsp;•&nbsp;&nbsp;</span>';
    var soc = function(h, t){ return '<a href="' + h + '" target="_blank" style="color:#0871B9;text-decoration:none;">' + t + '</a>'; };
    out.push('<tr><td class="px" style="padding:30px 40px 34px;background:#FFFFFF;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" dir="rtl">' +
      '<tr><td class="ff" style="' + FF + 'font-size:15px;line-height:22px;font-weight:700;text-align:center;padding-bottom:16px;">' +
      soc('https://www.facebook.com/ZalulIsrael/','פייסבוק') + dot + soc('https://www.instagram.com/zalulisrael/','אינסטגרם') + dot + soc('https://www.youtube.com/user/zalulisrael','יוטיוב') + dot + soc('https://zalul.org.il/','לאתר') + '</td></tr>' +
      '<tr><td class="ff" style="' + FF + 'font-size:12px;line-height:19px;color:#5E6E78;text-align:center;">צלול – עמותה להגנת הים, החופים והנחלים<br>' +
      (d.address.trim() ? esc(d.address.trim()) + ' &nbsp;|&nbsp; ' : '') + '<a href="https://zalul.org.il/contact-us/" target="_blank" style="color:#5E6E78;text-decoration:underline;">צרו קשר</a><br>' +
      'קיבלתם מייל זה כי נרשמתם לעדכונים מצלול.' + (d.unsub.trim() ? ' &nbsp;<a href="' + attr(d.unsub) + '" target="_blank" style="color:#5E6E78;text-decoration:underline;">להסרה מרשימת התפוצה</a>' : '') +
      ' &nbsp;|&nbsp; <a href="https://zalul.org.il/terms-and-privacy/" target="_blank" style="color:#5E6E78;text-decoration:underline;">מדיניות פרטיות</a></td></tr></table></td></tr>');
    out.push('</table>\n<!--[if mso]></td></tr></table><![endif]-->\n</td></tr></table>\n</body>\n</html>');
    return out.join('\n');
  }

  /* ---------- checks ---------- */
  function checks(d, html){
    var r = [];
    var bytes = new Blob([html]).size;
    var it0 = d.items[0] || {};
    function need(v, msg){ if (!String(v || '').trim()) r.push(['err', msg]); }
    need(d.subject, 'חסרה שורת נושא');
    need(d.h1a, 'חסרה כותרת הגיליון');
    need(d.opening, 'חסר טקסט פתיח');
    need(it0.title, 'לאייטם המוביל חסרה כותרת');
    need(it0.url, 'לאייטם המוביל חסר קישור');
    need(d.unsub, 'חסר קישור הסרה (בפרטים הקבועים) – חובה לפני שליחה');
    if (!d.address.trim()) r.push(['warn', 'חסרה כתובת העמותה בפוטר']);
    document.querySelectorAll('[data-max]').forEach(function(el){
      if (el.value.trim().length > +el.dataset.max) r.push(['warn', 'השדה "' + el.labels[0].childNodes[0].textContent.trim() + '" ארוך מהמומלץ']);
    });
    d.items.forEach(function(it, i){
      if (i > 0 && !itemFilled(it)) return;
      var n = i === 0 ? 'באייטם המוביל' : 'באייטם ' + (i + 1);
      if ((it.img || '').trim() && !/^https:\/\//i.test(it.img.trim())) r.push(['err', 'קישור התמונה ' + n + ' חייב להתחיל ב-https://']);
      if ((it.img || '').trim() && !(it.alt || '').trim()) r.push(['warn', 'חסר תיאור תמונה ' + n]);
      if ((it.img || '').indexOf('zalul.org.il') > -1) r.push(['warn', 'תמונה ' + n + ' מאוחסנת באתר צלול – עדיף מספריית ActiveTrail']);
      if (i > 0 && !(it.title || '').trim()) r.push(['err', 'חסרה כותרת ' + n]);
    });
    if (d.logo.indexOf('zalul.org.il') > -1) r.push(['warn', 'הלוגו מאוחסן באתר צלול – עדיף להעלות אותו ל-ActiveTrail']);
    var kb = (bytes / 1024).toFixed(1);
    r.push([bytes < 90 * 1024 ? 'ok' : 'err', 'משקל הקוד: ' + kb + 'KB (‏Gmail חותך מעל 102KB)']);
    if (!r.some(function(x){ return x[0] === 'err'; })) r.unshift(['ok', 'מוכן להעתקה']);
    return r;
  }

  /* ---------- state ---------- */
  function data(){
    var d = {}; FIELDS.concat(FIXED).forEach(function(k){ d[k] = $(k).value; }); d.items = readItems(); return d;
  }
  var lastHtml = '', timer = null;
  function update(){
    clearTimeout(timer);
    timer = setTimeout(function(){
      var d = data();
      document.querySelectorAll('.count').forEach(function(c){
        var el = $(c.dataset.for), n = el.value.trim().length, m = +el.dataset.max;
        c.textContent = n + ' / ' + m; c.classList.toggle('over', n > m);
      });
      lastHtml = build(d);
      $('pv').srcdoc = lastHtml;
      $('checks').innerHTML = '<h2>בדיקות</h2><ul>' + checks(d, lastHtml).map(function(x){
        return '<li class="' + x[0] + '">' + (x[0] === 'ok' ? '✓ ' : x[0] === 'warn' ? '! ' : '✕ ') + esc(x[1]) + '</li>';
      }).join('') + '</ul>';
      var draft = {}; FIELDS.forEach(function(k){ draft[k] = d[k]; }); draft.items = d.items; store(KEY_DRAFT, draft);
      var fixed = {}; FIXED.forEach(function(k){ fixed[k] = d[k]; }); store(KEY_FIXED, fixed);
    }, 150);
  }

  function toast(t){ var e = $('toast'); e.textContent = t; e.classList.add('show'); setTimeout(function(){ e.classList.remove('show'); }, 1800); }

  $('copy').addEventListener('click', function(){
    var done = function(){ toast('הקוד הועתק'); };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(lastHtml).then(done, fallback);
    } else fallback();
    function fallback(){
      var ta = document.createElement('textarea'); ta.value = lastHtml; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch(e) { toast('ההעתקה נכשלה – נסו להוריד קובץ'); }
      ta.remove();
    }
  });
  $('download').addEventListener('click', function(){
    var name = 'zalul-newsletter' + ($('issue').value.trim() ? '-' + $('issue').value.trim().replace(/\s+/g,'-') : '') + '.html';
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([lastHtml], {type:'text/html'})); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  });
  document.querySelectorAll('.seg button').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('.seg button').forEach(function(x){ x.classList.toggle('on', x === b); });
      $('pv').classList.toggle('mobile', b.dataset.w === 'mobile');
    });
  });
  $('addItem').addEventListener('click', function(){ addItem(); update(); });
  $('reset').addEventListener('click', function(){
    if (!window.confirm('לנקות את כל תוכן הגיליון? הפרטים הקבועים יישארו.')) return;
    FIELDS.forEach(function(k){ $(k).value = k === 'greet' ? 'שלום,' : ''; });
    itemsBox.innerHTML = ''; addItem(); addItem(); addItem(); update();
  });
  document.getElementById('f').addEventListener('input', update);
  $('pv').addEventListener('load', function(){
    try { var h = $('pv').contentDocument.documentElement.scrollHeight; if (h) $('pv').style.height = (h + 20) + 'px'; } catch(e) {}
  });

  /* ---------- init ---------- */
  var fx = load(KEY_FIXED); if (fx) FIXED.forEach(function(k){ if (fx[k] != null) $(k).value = fx[k]; });
  if (!fx || !fx.unsub) $('fixedBox').open = true;
  var dr = load(KEY_DRAFT);
  if (dr) {
    FIELDS.forEach(function(k){ if (dr[k] != null) $(k).value = dr[k]; });
    (dr.items && dr.items.length ? dr.items : [{},{},{}]).forEach(addItem);
  } else { addItem(); addItem(); addItem(); }
  update();
})();
</script>
